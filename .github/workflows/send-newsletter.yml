name: Send Newsletter Daily

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 0시 = 한국시간 오전 9시

  workflow_dispatch:

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout 코드 가져오기
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set environment variables
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
        echo "API_KEY=${{ secrets.API_KEY }}" >> $GITHUB_ENV
        echo "SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}" >> $GITHUB_ENV
        echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> $GITHUB_ENV
        echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> $GITHUB_ENV

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Check target directory (디버깅)
      run: ls -lah target/

    - name: Run Newsletter App
      run: java -Dfile.encoding=UTF-8 -jar target/ex05-1.0-SNAPSHOT.jar


